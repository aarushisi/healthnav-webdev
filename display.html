<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Profile Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>🩺 HealthNav</h2>
        <a href="form.html">Input Form</a>
        <a href="symptoms.html">Symptoms</a>
    </div>

    <!-- Outer wrapper to center everything beside the sidebar -->
    <div id="profile-page-content">
        <div class="profile-container">
        <div class="profile-field">
            <span class="profile-label">Name:</span>
            <span class="profile-value" id="profile-name">Loading...</span>
        </div>
        <div class="profile-field">
            <span class="profile-label">Age:</span>
            <span class="profile-value" id="profile-age">Loading...</span>
        </div>
        <div class="profile-field">
            <span class="profile-label">Gender:</span>
            <span class="profile-value" id="profile-gender">Loading...</span>
        </div>
        <div class="profile-field">
            <span class="profile-label">Insurance Provider:</span>
            <span class="profile-value" id="profile-insurance">Loading...</span>
        </div>
        <div class="profile-field">
            <span class="profile-label">Address:</span>
            <span class="profile-value" id="profile-address">Loading...</span>
        </div>
    
        <p class="section-heading">Symptoms:</p>
        <div id="profile-symptoms-scroll">
            <pre id="profile-symptoms">Loading...</pre>
        </div>
    
        <div id="correct-btn-container">
            <button id="correct-btn">Correct</button>
        </div>
        </div>
    </div>
    

    <script src="script.js"></script>
</body>
</html>

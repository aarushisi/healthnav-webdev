<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Doctor Navigator</h2>
        <a href="form.html">Profile</a>
        <a href="symptoms.html">Symptoms</a>
    </div>

    <!-- New wrapper to control movement of the profile container -->
    <div id="profile-container-wrapper">
        <div class="profile-container">
            <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
            <p><strong>Age:</strong> <span id="profile-age">Loading...</span></p>
            <p><strong>Gender:</strong> <span id="profile-gender">Loading...</span></p>
            <p><strong>Insurance Provider:</strong> <span id="profile-insurance">Loading...</span></p>
            <p><strong>Address:</strong> <span id="profile-address">Loading...</span></p>
            <p><strong>Symptoms:</strong> <span id="profile-symptoms">Loading...</span></p>
        </div>
    </div>

    <button id="correct-btn">Correct</button>

    <script src="script.js"></script> <!-- Link JavaScript file -->
</body>
</html>

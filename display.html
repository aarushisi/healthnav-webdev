<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Profile Summary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>🩺 HealthNav</h2>
        <a href="form.html">Input Form</a>
        <a href="symptoms.html">Symptoms</a>
    </div>

    <!-- Outer wrapper to center everything beside the sidebar -->
    <div id="profile-page-content">
        <div class="profile-container">
            <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
            <p><strong>Age:</strong> <span id="profile-age">Loading...</span></p>
            <p><strong>Gender:</strong> <span id="profile-gender">Loading...</span></p>
            <p><strong>Insurance Provider:</strong> <span id="profile-insurance">Loading...</span></p>
            <p><strong>Address:</strong> <span id="profile-address">Loading...</span></p>
            <p><strong>Symptoms:</strong></p>
            <div id="profile-symptoms-scroll">
                <pre id="profile-symptoms">Loading...</pre>
            </div>
            <div id="correct-btn-container">
                <button id="correct-btn">Correct</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

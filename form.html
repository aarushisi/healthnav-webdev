<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthNav</title>
</head>
<body>
    <div class="sidebar">
        <h2>🩺 HealthNav</h2>
    </div>

    <!-- New wrapper to move and resize the form as a unit -->
    <div id="form-container">
        <form id="info-form">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" min="0" max="120" required><br><br>

            <label for="gender">Gender:</label><br>
            <select id="gender" name="gender">
                <option value="Man">Man</option>
                <option value="Woman">Woman</option>
                <option value="NonBinary">Non-Binary</option>
                <option value="preferNotToSay">Would Rather Not Say</option>
            </select><br><br>

            <label for="insurance">Insurance Provider:</label><br>
            <select id="insurance" name="insurance">
                <option value="cigna">Cigna</option>
                <option value="aetna">Aetna</option>
                <option value="blueCrossBlueShield">Blue Cross Blue Shield</option>
                <option value="unitedHealthcare">United Healthcare</option>
            </select><br><br>

            <!-- Address Fields on One Line -->
            <label>Address:</label>
            <div id="address-fields">
                <input type="text" id="street" name="street" placeholder="Street Address" required>
                <input type="text" id="city" name="city" placeholder="City" required>
                <select id="state" name="state" required>
                    <option value="" disabled selected>State</option>
                    <option value="AL">AL</option>
                    <option value="AK">AK</option>
                    <option value="AZ">AZ</option>
                    <option value="AR">AR</option>
                    <option value="CA">CA</option>
                    <option value="CO">CO</option>
                    <option value="CT">CT</option>
                    <option value="DE">DE</option>
                    <option value="FL">FL</option>
                    <option value="GA">GA</option>
                    <option value="HI">HI</option>
                    <option value="ID">ID</option>
                    <option value="IL">IL</option>
                    <option value="IN">IN</option>
                    <option value="IA">IA</option>
                    <option value="KS">KS</option>
                    <option value="KY">KY</option>
                    <option value="LA">LA</option>
                    <option value="ME">ME</option>
                    <option value="MD">MD</option>
                    <option value="MA">MA</option>
                    <option value="MI">MI</option>
                    <option value="MN">MN</option>
                    <option value="MS">MS</option>
                    <option value="MO">MO</option>
                    <option value="MT">MT</option>
                    <option value="NE">NE</option>
                    <option value="NV">NV</option>
                    <option value="NH">NH</option>
                    <option value="NJ">NJ</option>
                    <option value="NM">NM</option>
                    <option value="NY">NY</option>
                    <option value="NC">NC</option>
                    <option value="ND">ND</option>
                    <option value="OH">OH</option>
                    <option value="OK">OK</option>
                    <option value="OR">OR</option>
                    <option value="PA">PA</option>
                    <option value="RI">RI</option>
                    <option value="SC">SC</option>
                    <option value="SD">SD</option>
                    <option value="TN">TN</option>
                    <option value="TX">TX</option>
                    <option value="UT">UT</option>
                    <option value="VT">VT</option>
                    <option value="VA">VA</option>
                    <option value="WA">WA</option>
                    <option value="WV">WV</option>
                    <option value="WI">WI</option>
                    <option value="WY">WY</option>
                </select>
                <input type="text" id="zip" name="zip" placeholder="ZIP Code" required pattern="\d{5}" title="Enter a valid 5-digit ZIP code">
            </div><br>

            <input type="submit" value="Submit">
        </form>
    </div>

    <script src="script.js"></script> <!-- Link to the script.js file -->
</body>
</html>
